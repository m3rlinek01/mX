[package]
name = "mx-metal"
description = "mX: the Metal 3 backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
mx-types.workspace = true
mx-shader = { workspace = true, features = ["msl"] }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true
raw-window-handle = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-metal", "objc2-core-foundation", "CALayer", "CAMetalLayer"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "objc2-core-foundation", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "UIView", "UIResponder"] }
